name: 매일 릴스 제작

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST
  workflow_dispatch:
    inputs:
      dry:
        description: "시험(저장소에 쓰지 않음) true/false"
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-reels
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python3 -m pip install -q pillow numpy
      - name: 릴스 제작
        env:
          DAILY_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: python3 tools/daily_reels.py .
      - name: 결과 저장
        run: |
          if [ -n "$(git status --porcelain social)" ]; then
            git config user.name "daily-reels"
            git config user.email "actions@users.noreply.github.com"
            git add social
            git commit -m "자동 릴스 제작 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
