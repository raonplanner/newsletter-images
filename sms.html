<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>문자 보내기</title>
<style>
body{margin:0;padding:24px 16px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;word-break:keep-all;background:#f5f7fa;color:#222}
.box{max-width:440px;margin:0 auto;background:#fff;border:1px solid #1f3a5f;border-radius:10px;overflow:hidden}
.head{background:#1f3a5f;color:#fff;padding:12px 14px;font-weight:bold}
.msg{margin:14px;padding:12px;background:#f2f4f7;border-radius:6px;line-height:1.6;white-space:pre-wrap}
a.btn{display:block;margin:0 14px 10px;padding:15px;background:#1f8f4e;color:#fff;text-align:center;border-radius:8px;font-size:18px;font-weight:bold;text-decoration:none}
button{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:12px;border:1px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:8px;font-size:15px}
.note{font-size:13px;color:#666;margin:0 14px 14px}
</style>
</head>
<body>
<div class="box">
  <div class="head">📱 생일 축하 문자</div>
  <div class="msg" id="msg"></div>
  <a class="btn" id="go" href="#">문자앱 열기</a>
  <button id="copy" type="button">문구 복사</button>
  <p class="note" id="note"></p>
</div>
<script>
// 고객 정보는 주소의 # 뒷부분에만 있으므로 서버로 전송되지 않는다.
var p = new URLSearchParams(location.hash.slice(1));
var to = (p.get('to') || '').replace(/[^0-9]/g, '');
var body = p.get('body') || '';
document.getElementById('msg').textContent = body;
var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
var url = 'sms:' + to + (ios ? '&' : '?') + 'body=' + encodeURIComponent(body);
document.getElementById('go').href = url;
document.getElementById('note').textContent = to ? '' : '받는 사람은 문자앱에서 직접 선택해 주세요.';
document.getElementById('copy').onclick = function () {
  try { navigator.clipboard.writeText(body); this.textContent = '복사됨'; } catch (e) {}
};
if (body) { setTimeout(function () { location.href = url; }, 300); }
</script>
</body>
</html>
